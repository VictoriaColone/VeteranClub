server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
    threads:
      max: 40
      min-spare: 4
spring:
  application:
    name: norman-club
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/norman_club?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&sslMode=REQUIRED}
    username: ${DB_USERNAME:norman_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    log-request-details: false
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
club:
  manager-password-hash-file: ${CLUB_MANAGER_PASSWORD_HASH_FILE:}
  development: ${CLUB_DEVELOPMENT:false}
  encryption-key: ${CLUB_ENCRYPTION_KEY:}
  hash-key: ${CLUB_HASH_KEY:}
  cookie-secure: ${COOKIE_SECURE:true}
  allowed-origins: ${ALLOWED_ORIGINS:https://club.example.com}
  trusted-proxies: ${TRUSTED_PROXIES:}
  sms-provider: ${SMS_PROVIDER:disabled}
  sms-sign: ${ALIYUN_SMS_SIGN:}
  sms-template: ${ALIYUN_SMS_TEMPLATE:}
  sms-outbox: ${SMS_OUTBOX:.local/sms-outbox.jsonl}
  sms-daily-limit: ${SMS_DAILY_LIMIT:200}
  jobs-enabled: ${JOBS_ENABLED:true}
logging:
  level:
    root: INFO
    org.springframework.web: WARN
  file:
    name: ${LOG_FILE:.local/server.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
