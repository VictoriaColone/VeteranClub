services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 512m
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=30", "--mysqlx=0", "--slow-query-log=OFF"]
    environment:
      MYSQL_DATABASE: norman_club
      MYSQL_USER: norman_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a strong database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a distinct root password}
      TZ: Asia/Shanghai
    volumes: ["mysql_data:/var/lib/mysql"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    build: ../server
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/norman_club?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&sslMode=REQUIRED
      DB_USERNAME: norman_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      CLUB_ENCRYPTION_KEY: ${CLUB_ENCRYPTION_KEY:?Generate a 32-byte Base64 key}
      CLUB_HASH_KEY: ${CLUB_HASH_KEY:?Generate a separate 32-byte Base64 key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the exact HTTPS origin}
      TRUSTED_PROXIES: 172.30.0.2
      SMS_PROVIDER: ${SMS_PROVIDER:-disabled}
      ALIYUN_SMS_SIGN: ${ALIYUN_SMS_SIGN:-}
      ALIYUN_SMS_TEMPLATE: ${ALIYUN_SMS_TEMPLATE:-}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      LOG_FILE: /tmp/norman.log
    networks: [application,database]
    read_only: true
    tmpfs: ["/tmp:size=96m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    mem_limit: 96m
    ports: ["80:80", "443:443"]
    depends_on: [api]
    volumes:
      - ../dist-http:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      application: {ipv4_address: 172.30.0.2}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  mysql_data:
networks:
  application:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  database:
    internal: true
