# Loaded only by the acceptance server listening on 127.0.0.1:8088.
location = /database { return 302 /database/; }
location ^~ /database/ {
    client_max_body_size 8m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/norman-db-admin/current/adminer.php;
    fastcgi_param SCRIPT_NAME /database/;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/norman-db-admin.sock;
    fastcgi_read_timeout 40s;
}
