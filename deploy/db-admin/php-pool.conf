[norman-db-admin]
user = norman-db-admin
group = norman-db-admin
listen = /run/php/norman-db-admin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 100
clear_env = yes
security.limit_extensions = .php
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 30
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 4M
php_admin_value[session.save_path] = /var/lib/norman-db-admin/sessions
php_admin_value[upload_tmp_dir] = /var/lib/norman-db-admin/uploads
php_admin_value[error_log] = /var/log/norman-db-admin/php.log
php_admin_value[open_basedir] = /opt/norman-db-admin:/var/lib/norman-db-admin:/usr/share/php:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.cookie_path] = /database/
