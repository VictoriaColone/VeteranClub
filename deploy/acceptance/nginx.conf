server {
    listen 127.0.0.1:8088;
    server_name localhost;
    root /opt/norman-acceptance/current/web;
    index index.html;
    client_max_body_size 64k;
    client_body_timeout 10s;
    access_log /var/log/nginx/norman-acceptance.log combined;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    location = / { return 302 /mobile/; }
    location = /mobile { return 302 /mobile/; }
    location = /admin { return 302 /admin/; }
    location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /api/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location ~ /\. { deny all; }
}
