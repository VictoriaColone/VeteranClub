worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    map $uri $auth_limit_key { default ""; ~^/api/v1/auth/ $binary_remote_addr; }
    limit_req_zone $auth_limit_key zone=login:10m rate=2r/s;
    limit_req_status 429;
    # Query strings may contain private search terms, so they are excluded from access logs.
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log safe;
    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location = / { return 302 /mobile/; }
        location = /mobile { return 302 /mobile/; }
        location = /admin { return 302 /admin/; }
        location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
        location /admin/ { try_files $uri $uri/ /admin/index.html; }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_hide_header X-Powered-By;
        }
        location ~ /\. { deny all; }
    }
}
