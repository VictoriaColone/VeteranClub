name: Backend and HTTP frontend
on:
  push:
    branches: [main]
    paths: ['server/**', 'apps/**', 'packages/**', 'scripts/**', 'package*.json', '.github/workflows/backend.yml']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: norman_test
          MYSQL_USER: norman_ci
          MYSQL_PASSWORD: isolated-ci-test-password
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend integration tests on MySQL 8.4
        working-directory: server
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/norman_test?sslMode=REQUIRED
          TEST_DB_USERNAME: norman_ci
          TEST_DB_PASSWORD: isolated-ci-test-password
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Private acceptance package and isolation tests
        working-directory: server
        run: ./mvnw -B -Pacceptance verify
      - run: npm ci
      - run: npm run check && npm test && npm run build:all && npm run build:http && npm run build:acceptance
